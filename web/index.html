<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BillSplit" />
    <meta name="theme-color" content="#f3eee3" />
    <meta name="description" content="Split travel expenses with friends" />
    <title>Travel Bill Split</title>
    <script>
      // Apply the saved appearance + colour theme before first paint (no flash).
      // Keep in sync with src/app/theme.ts.
      ;(function () {
        var p = 'system'
        var pal = 'washi'
        try {
          p = localStorage.getItem('tbs-theme') || 'system'
          pal = localStorage.getItem('tbs-palette') === 'classic' ? 'classic' : 'washi'
        } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
        root.setAttribute('data-palette', pal)
        var colors = { washi: ['#f3eee3', '#1b1916'], classic: ['#ffffff', '#111827'] }
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', colors[pal][dark ? 1 : 0])
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
