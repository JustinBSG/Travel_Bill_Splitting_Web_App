<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BillSplit" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Split travel expenses with friends" />
    <title>Travel Bill Split</title>
    <script>
      // Apply the saved theme before first paint (no flash). Keep in sync with src/app/theme.ts.
      ;(function () {
        var p = 'system'
        try {
          p = localStorage.getItem('tbs-theme') || 'system'
        } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', dark ? '#111827' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
